<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b1118">
  <title>Live Traffic</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3ynxNVZqWjMZhhpNHPXwTlCzK91zM=" crossorigin="">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">AVIATION LIVE TRAFFIC</div>
        <h1 id="locationTitle">Alpena Area</h1>
      </div>
      <div class="status-wrap">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Connecting…</span>
      </div>
    </header>

    <section class="controls" aria-label="Traffic controls">
      <div class="control-group">
        <label for="rangeSelect">Range</label>
        <select id="rangeSelect">
          <option value="25">25 NM</option>
          <option value="50">50 NM</option>
          <option value="100" selected>100 NM</option>
          <option value="150">150 NM</option>
          <option value="200">200 NM</option>
          <option value="250">250 NM</option>
        </select>
      </div>

      <div class="control-group">
        <label for="labelSelect">Labels</label>
        <select id="labelSelect">
          <option value="callsign" selected>Callsign</option>
          <option value="altitude">Altitude</option>
          <option value="both">Both</option>
          <option value="none">None</option>
        </select>
      </div>

      <label class="switch-control">
        <input type="checkbox" id="trailToggle">
        <span>Trails</span>
      </label>

      <button id="recenterBtn" type="button">Recenter</button>
    </section>

    <section class="map-wrap">
      <div id="map" aria-label="Live aircraft map"></div>
      <div class="hud">
        <div><strong id="aircraftCount">—</strong><span>aircraft</span></div>
        <div><strong id="rangeHud">100</strong><span>NM range</span></div>
        <div><strong id="updatedHud">—</strong><span>updated</span></div>
      </div>
    </section>

    <aside class="detail-card" id="detailCard" hidden>
      <button class="detail-close" id="detailClose" type="button" aria-label="Close aircraft details">×</button>
      <div class="eyebrow">SELECTED AIRCRAFT</div>
      <h2 id="detailTitle">—</h2>
      <div class="detail-grid">
        <div><span>Registration</span><strong id="detailReg">—</strong></div>
        <div><span>Type</span><strong id="detailType">—</strong></div>
        <div><span>Altitude</span><strong id="detailAlt">—</strong></div>
        <div><span>Groundspeed</span><strong id="detailGs">—</strong></div>
        <div><span>Track</span><strong id="detailTrack">—</strong></div>
        <div><span>Vertical rate</span><strong id="detailVr">—</strong></div>
      </div>
    </aside>

    <footer class="footer">
      <span>Data: ADSB.lol</span>
      <span>For informational/enthusiast use only</span>
    </footer>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
